<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10191b">
  <meta name="description" content="林蓁的作品集。">
  <title>林蓁｜作品集</title>
  <style>
    @font-face { font-family:"Noto Sans SC"; font-style:normal; font-weight:400; font-display:swap; src:url("assets/fonts/noto-sans-sc-400.ttf") format("truetype"); }
    @font-face { font-family:"Noto Sans SC"; font-style:normal; font-weight:500; font-display:swap; src:url("assets/fonts/noto-sans-sc-500.ttf") format("truetype"); }
    @font-face { font-family:"Noto Sans SC"; font-style:normal; font-weight:700; font-display:swap; src:url("assets/fonts/noto-sans-sc-700.ttf") format("truetype"); }
    * { box-sizing:border-box; }
    html,body { width:100vw; min-width:100vw; height:100%; margin:0; overflow:hidden; background:#10191b; }
    #portfolio-frame { position:fixed; left:0; top:0; right:auto; bottom:auto; display:block; width:100vw; min-width:100vw; max-width:none; height:100vh; height:100dvh; border:0; background:#10191b; }
    .music-player { position:fixed; z-index:10000; left:16px; bottom:14px; display:flex; align-items:center; gap:10px; min-height:42px; padding:7px 10px; border:1px solid rgba(192,164,106,.45); background:rgba(13,21,22,.9); color:#e8e2d2; box-shadow:0 5px 20px rgba(0,0,0,.2); backdrop-filter:blur(10px); font:11px/1.2 "Noto Sans SC","Microsoft YaHei",sans-serif; }
    .music-toggle { display:flex; align-items:center; gap:8px; padding:2px 3px; border:0; color:inherit; background:transparent; font:inherit; cursor:pointer; }
    .music-toggle:focus-visible,.music-volume:focus-visible { outline:2px solid #c0a46a; outline-offset:3px; }
    .music-icon { display:grid; place-items:center; width:24px; height:24px; border:1px solid rgba(192,164,106,.56); border-radius:50%; color:#d7bf83; font:14px/1 Georgia,serif; }
    .music-label { white-space:nowrap; }
    .music-volume { width:64px; accent-color:#c0a46a; cursor:pointer; }
    .music-player[data-playing="true"] .music-icon { box-shadow:0 0 11px rgba(192,164,106,.32); }
    .music-player[data-video="true"] .music-label { color:#d7bf83; }
    @media(max-width:560px) { .music-player { left:10px; bottom:10px; min-height:38px; gap:7px; padding:5px 8px; } .music-volume { width:48px; } }
    @media(prefers-reduced-motion:reduce) { .music-player { backdrop-filter:none; } }
  </style>
</head>
<body>
  <iframe id="portfolio-frame" title="林蓁作品集" allow="autoplay; fullscreen; picture-in-picture"></iframe>
  <aside class="music-player" id="music-player" aria-label="作品集背景音乐" data-playing="false" data-video="false">
    <button class="music-toggle" id="music-toggle" type="button" aria-pressed="false">
      <span class="music-icon" aria-hidden="true">♫</span>
      <span class="music-label" id="music-label">开启背景音乐</span>
    </button>
    <input class="music-volume" id="music-volume" type="range" min="0" max="100" value="62" aria-label="背景音乐音量" title="背景音乐音量">
  </aside>
  <audio id="portfolio-audio" src="assets/audio/moonless-drift-extended.m4a" preload="none" loop></audio>
  <script>
    (() => {
      if (window.parent !== window) {
        const destination = new URL("portfolio-home.html" + window.location.search + window.location.hash, window.location.href);
        window.location.replace(destination.href);
        return;
      }

      const frame = document.getElementById("portfolio-frame");
      const audio = document.getElementById("portfolio-audio");
      const toggle = document.getElementById("music-toggle");
      const label = document.getElementById("music-label");
      const volume = document.getElementById("music-volume");
      const player = document.getElementById("music-player");
      const params = new URLSearchParams(window.location.search);
      const initialRoute = params.get("page") || (window.location.hash ? "portfolio-home.html" + window.location.hash : "portfolio-home.html");
      const heldVideos = new Set();
      const boundVideos = new WeakSet();
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const readSetting = (key) => { try { return localStorage.getItem(key); } catch (_) { return null; } };
      const writeSetting = (key, value) => { try { localStorage.setItem(key, value); } catch (_) {} };
      let musicWanted = readSetting("portfolio-music-enabled") !== "false";
      let playbackBlocked = false;
      let fadeFrame = 0;
      let previousVolume = Number(readSetting("portfolio-music-volume"));
      let replacingFromHistory = false;
      let firstFrameLoad = true;
      let childRouteInitialized = false;

      if (!Number.isFinite(previousVolume) || previousVolume <= 0 || previousVolume > 100) previousVolume = 62;
      volume.value = String(previousVolume);
      audio.volume = 0;

      function getRouteFromUrl(url) {
        return url.pathname.split("/").pop() + url.search + url.hash;
      }

      function safeRoute(route) {
        try {
          const url = new URL(route, window.location.href);
          if (url.origin !== window.location.origin || !/^[a-z0-9-]+\.html$/i.test(url.pathname.split("/").pop())) return "portfolio-home.html";
          return getRouteFromUrl(url);
        } catch (_) { return "portfolio-home.html"; }
      }

      function setFrameRoute(route, fromHistory) {
        replacingFromHistory = Boolean(fromHistory);
        frame.src = safeRoute(route);
      }

      function syncAddressFromRoute(route, replace) {
        let safe;
        try {
          const childUrl = new URL(route, window.location.href);
          if (childUrl.origin !== window.location.origin || !/^[a-z0-9-]+\.html$/i.test(childUrl.pathname.split("/").pop())) return;
          safe = getRouteFromUrl(childUrl);
        } catch (_) { return; }
        const params = new URLSearchParams(window.location.search);
        const currentRoute = params.get("page") || (window.location.hash ? "portfolio-home.html" + window.location.hash : "portfolio-home.html");
        const firstRoute = !childRouteInitialized;
        childRouteInitialized = true;
        if (currentRoute === safe) {
          updateLanguage();
          return;
        }
        const next = new URL(window.location.href);
        next.search = "";
        next.searchParams.set("page", safe);
        next.hash = "";
        const state = { page: safe };
        if (replace || firstRoute || replacingFromHistory) window.history.replaceState(state, "", next.href);
        else window.history.pushState(state, "", next.href);
        updateLanguage();
      }

      function syncAddress(push) {
        try {
          const childUrl = new URL(frame.contentWindow.location.href);
          if (childUrl.origin !== window.location.origin) return;
          syncAddressFromRoute(getRouteFromUrl(childUrl), !push);
        } catch (_) { /* The child frame may still be changing documents. */ }
      }

      function updateLanguage() {
        let english = false;
        try { english = new URL(frame.contentWindow.location.href).searchParams.get("lang") === "en" || frame.contentDocument.documentElement.lang === "en"; } catch (_) {}
        document.documentElement.lang = english ? "en" : "zh-CN";
        volume.setAttribute("aria-label", english ? "Ambient music volume" : "背景音乐音量");
        volume.title = english ? "Ambient music volume" : "背景音乐音量";
        label.textContent = heldVideos.size && musicWanted
          ? (english ? "Video active · music paused" : "视频区域使用中 · 音乐暂停")
          : playbackBlocked && musicWanted
            ? (english ? "Click the page to start music" : "点击页面开启背景音乐")
          : musicWanted
            ? (english ? "Ambient music on" : "背景音乐已开启")
            : (english ? "Play ambient music" : "开启背景音乐");
        toggle.setAttribute("aria-label", label.textContent);
      }

      function setButtonState() {
        const audible = musicWanted && !audio.paused && heldVideos.size === 0;
        player.dataset.playing = String(audible);
        player.dataset.video = String(heldVideos.size > 0);
        toggle.setAttribute("aria-pressed", String(musicWanted));
        updateLanguage();
      }

      function fadeTo(target, done) {
        cancelAnimationFrame(fadeFrame);
        const start = audio.volume;
        const duration = reducedMotion.matches ? 180 : 700;
        const started = performance.now();
        const step = (now) => {
          const ratio = Math.min(1, (now - started) / duration);
          const eased = ratio * ratio * (3 - 2 * ratio);
          audio.volume = Math.max(0, Math.min(1, start + (target - start) * eased));
          if (ratio < 1) fadeFrame = requestAnimationFrame(step);
          else { fadeFrame = 0; if (done) done(); }
        };
        fadeFrame = requestAnimationFrame(step);
      }

      function targetVolume() { return (Number(volume.value) / 100) * 0.18; }

      async function startMusic() {
        musicWanted = true;
        writeSetting("portfolio-music-enabled", "true");
        playbackBlocked = false;
        setButtonState();
        if (heldVideos.size) return;
        try {
          await audio.play();
          fadeTo(targetVolume(), setButtonState);
        } catch (_) {
          playbackBlocked = true;
          setButtonState();
        }
      }

      function stopMusic() {
        musicWanted = false;
        playbackBlocked = false;
        writeSetting("portfolio-music-enabled", "false");
        fadeTo(0, () => { audio.pause(); setButtonState(); });
        setButtonState();
      }

      function holdForVideo(key, active) {
        if (active) heldVideos.add(key);
        else heldVideos.delete(key);
        if (heldVideos.size) {
          if (!audio.paused || audio.volume > 0) fadeTo(0, () => { audio.pause(); setButtonState(); });
          setButtonState();
        } else if (musicWanted) {
          audio.play().then(() => fadeTo(targetVolume(), setButtonState)).catch(setButtonState);
          setButtonState();
        } else setButtonState();
      }

      function parsePlayerMessage(data) {
        let value = data;
        if (typeof value === "string") {
          try { value = JSON.parse(value); } catch (_) {}
        }
        const type = typeof value === "string" ? value : [value?.type, value?.event, value?.action, value?.cmd, value?.name].filter(Boolean).join(" ");
        const normalized = String(type).toLowerCase();
        if (/pause|paused|ended|stop|stopped|videoend/.test(normalized)) return false;
        if (/playing|playstart|video.?play|\bplay\b/.test(normalized)) return true;
        return null;
      }

      function bindChildVideos() {
        let childDocument;
        try { childDocument = frame.contentDocument; } catch (_) { return; }
        if (!childDocument) return;
        childDocument.querySelectorAll("video").forEach((video) => {
          if (boundVideos.has(video)) return;
          boundVideos.add(video);
          const key = video;
          video.addEventListener("play", () => holdForVideo(key, true));
          video.addEventListener("playing", () => holdForVideo(key, true));
          video.addEventListener("pause", () => holdForVideo(key, false));
          video.addEventListener("ended", () => holdForVideo(key, false));
        });
        childDocument.querySelectorAll("iframe").forEach((videoFrame) => {
          if (!/bilibili|youtube|youtu\.be/i.test(videoFrame.src)) return;
          const key = videoFrame.contentWindow;
          videoFrame.addEventListener("focus", () => holdForVideo(key, true));
          videoFrame.addEventListener("blur", () => holdForVideo(key, false));
        });
      }

      frame.addEventListener("load", () => {
        if (heldVideos.size) {
          heldVideos.clear();
          if (musicWanted) audio.play().then(() => fadeTo(targetVolume(), setButtonState)).catch(setButtonState);
        }
        bindChildVideos();
        syncAddress(!firstFrameLoad && !replacingFromHistory);
        firstFrameLoad = false;
        replacingFromHistory = false;
        try {
          const doc = frame.contentDocument;
          document.title = doc.title || "林蓁｜作品集";
          new MutationObserver(updateLanguage).observe(doc.documentElement, { attributes:true, attributeFilter:["lang"] });
          const startFromChildGesture = (event) => {
            if (!playbackBlocked || !musicWanted || event.target.closest?.("iframe")) return;
            startMusic();
          };
          doc.addEventListener("pointerdown", startFromChildGesture, true);
          doc.addEventListener("keydown", startFromChildGesture, true);
          doc.addEventListener("click", () => window.setTimeout(() => syncAddress(true), 80), true);
          frame.contentWindow.addEventListener("hashchange", () => syncAddress(true));
          frame.contentWindow.addEventListener("popstate", () => syncAddress(true));
        } catch (_) {}
      });

      window.addEventListener("message", (event) => {
        if (event.source === frame.contentWindow && event.data?.type === "portfolio-route") {
          syncAddressFromRoute(event.data.route, Boolean(event.data.replace));
          return;
        }
        const state = parsePlayerMessage(event.data);
        if (state === null) return;
        let isVideoSource = false;
        try {
          isVideoSource = Array.from(frame.contentDocument.querySelectorAll("iframe"))
            .some((item) => /bilibili|youtube|youtu\.be/i.test(item.src) && item.contentWindow === event.source);
        } catch (_) {}
        if (isVideoSource) holdForVideo(event.source, state);
      });

      window.addEventListener("popstate", () => {
        const route = new URLSearchParams(window.location.search).get("page") || "portfolio-home.html";
        setFrameRoute(route, true);
      });

      toggle.addEventListener("click", () => musicWanted ? stopMusic() : startMusic());
      const startFromShellGesture = (event) => {
        if (!playbackBlocked || !musicWanted || event.target.closest?.("#music-player")) return;
        startMusic();
      };
      window.addEventListener("pointerdown", startFromShellGesture, true);
      window.addEventListener("keydown", startFromShellGesture, true);
      volume.addEventListener("input", () => {
        writeSetting("portfolio-music-volume", volume.value);
        if (musicWanted && heldVideos.size === 0) fadeTo(targetVolume(), setButtonState);
      });

      setFrameRoute(initialRoute, false);
      setButtonState();
      if (musicWanted) startMusic();
    })();
  </script>
</body>
</html>
